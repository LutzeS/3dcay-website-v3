<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>3DCAY · Backend</title>
<style>
  :root{ --red:#e3101a; --black:#0A0A0A; --gray-50:#FAFAFA; --gray-100:#F0F0F0; --gray-200:#E5E5E5; --gray-500:#737373; --gray-700:#404040; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--black);background:var(--gray-50)}
  a{color:var(--red)}
  .hidden{display:none!important}
  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black)}
  #login .card{background:#fff;border-radius:16px;padding:36px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #login h1{font-size:20px;margin:0 0 4px} #login p{color:var(--gray-500);font-size:13px;margin:0 0 20px}
  input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--gray-200);border-radius:8px;font-size:14px;font-family:inherit}
  textarea{min-height:160px;resize:vertical}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border:none;border-radius:100px;padding:10px 22px;font-weight:600;font-size:14px;cursor:pointer}
  .btn--ghost{background:#fff;color:var(--black);border:1px solid var(--gray-200)}
  .btn--sm{padding:6px 14px;font-size:13px}
  /* App */
  header.top{background:var(--black);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:60px;position:sticky;top:0;z-index:10}
  .logo{font-weight:800;letter-spacing:-0.03em}.logo span{color:var(--red)}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:8px}
  nav.tabs button{background:none;border:none;color:rgba(255,255,255,.65);font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}
  nav.tabs button.active{color:#fff;background:rgba(255,255,255,.1)}
  .spacer{margin-left:auto}
  main{max-width:1080px;margin:0 auto;padding:28px 24px}
  h2{font-size:22px;margin:0 0 18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
  .stat{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:20px}
  .stat .v{font-size:30px;font-weight:800;line-height:1.1}.stat .v em{color:var(--red);font-style:normal}
  .stat .l{font-size:12px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
  .panel{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:22px;margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:top}
  th{color:var(--gray-500);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin:12px 0 5px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;background:var(--gray-100);color:var(--gray-700)}
  .pill.neu{background:#fde8e9;color:var(--red)}
  .muted{color:var(--gray-500);font-size:13px}
  .funnel{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
  .funnel .step{flex:1;min-width:120px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;padding:18px;text-align:center;margin-right:10px}
  .funnel .step .n{font-size:28px;font-weight:800}.funnel .step .t{font-size:12px;color:var(--gray-500);margin-top:4px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h1>3DCAY <span style="color:var(--red)">Backend</span></h1>
    <p>Bitte anmelden</p>
    <input type="password" id="pw" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:14px"><button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">Anmelden</button></div>
    <p id="loginErr" style="color:var(--red);margin-top:12px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">3D<span>CAY</span></div>
    <nav class="tabs" id="tabs">
      <button data-t="dash" class="active">Dashboard</button>
      <button data-t="leads">Leads</button>
      <button data-t="fit">Fit-Check</button>
      <button data-t="wp">Whitepapers</button>
      <button data-t="news">News</button>
      <button data-t="nl">Newsletter</button>
    </nav>
    <div class="spacer"></div>
    <button class="btn btn--ghost btn--sm" onclick="logout()">Abmelden</button>
  </header>
  <main>
    <section id="v-dash"></section>
    <section id="v-leads" class="hidden"></section>
    <section id="v-fit" class="hidden"></section>
    <section id="v-wp" class="hidden"></section>
    <section id="v-news" class="hidden"></section>
    <section id="v-nl" class="hidden"></section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const FN = '/.netlify/functions/';
let TOKEN = sessionStorage.getItem('3dcay_admin_token') || '';
let DATA = null;

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

async function api(path, opts={}){
  const res = await fetch(FN+path, { ...opts, headers:{ 'content-type':'application/json', ...(TOKEN?{authorization:'Bearer '+TOKEN}:{}), ...(opts.headers||{}) } });
  if(res.status===401){ logout(); throw new Error('auth'); }
  return res.json();
}

async function doLogin(){
  const pw=document.getElementById('pw').value;
  document.getElementById('loginErr').textContent='';
  try{
    const r=await fetch(FN+'admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});
    const j=await r.json();
    if(!r.ok||!j.token){ document.getElementById('loginErr').textContent = j.hint||'Login fehlgeschlagen'; return; }
    TOKEN=j.token; sessionStorage.setItem('3dcay_admin_token',TOKEN);
    enter();
  }catch(e){ document.getElementById('loginErr').textContent='Verbindungsfehler'; }
}
function logout(){ TOKEN=''; sessionStorage.removeItem('3dcay_admin_token'); document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); }

async function enter(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await load();
}
async function load(){ try{ DATA=await api('admin-data'); render(); }catch(e){} }

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  ['dash','leads','fit','wp','news','nl'].forEach(t=>document.getElementById('v-'+t).classList.toggle('hidden',t!==b.dataset.t));
});

function render(){ renderDash(); renderLeads(); renderFit(); renderWp(); renderNews(); renderNl(); }

function renderDash(){
  const t=DATA.totals, s=DATA.subscriberStats, f=DATA.funnel;
  document.getElementById('v-dash').innerHTML=`
    <h2>Dashboard</h2>
    <div class="cards">
      <div class="stat"><div class="v">${t.leads}</div><div class="l">Leads</div></div>
      <div class="stat"><div class="v"><em>${s.confirmed||0}</em></div><div class="l">Newsletter bestätigt</div></div>
      <div class="stat"><div class="v">${s.pending||0}</div><div class="l">Newsletter offen</div></div>
      <div class="stat"><div class="v">${f.start}</div><div class="l">Fit-Check Starts</div></div>
      <div class="stat"><div class="v">${t.whitepapers}</div><div class="l">Whitepapers</div></div>
      <div class="stat"><div class="v">${t.news}</div><div class="l">News</div></div>
    </div>`;
}

function renderLeads(){
  const rows=(DATA.leads||[]).map(l=>`
    <tr>
      <td>${fmt(l.created)}</td><td><span class="pill">${esc(l.type)}</span></td>
      <td>${esc(l.name)}<div class="muted">${esc(l.company)}</div></td>
      <td>${esc(l.email)}<div class="muted">${esc(l.phone)}</div></td>
      <td>${esc(l.interest)} ${l.message?'<div class="muted">'+esc(l.message).slice(0,80)+'</div>':''}</td>
      <td><select onchange="setLeadStatus('${l.id}',this.value)">
        ${['neu','kontaktiert','qualifiziert','geschlossen'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}
      </select></td>
      <td><button class="btn btn--ghost btn--sm" onclick="delLead('${l.id}')">×</button></td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">Noch keine Leads.</td></tr>';
  document.getElementById('v-leads').innerHTML=`<h2>Lead-Inbox</h2><div class="panel" style="overflow:auto">
    <table><thead><tr><th>Eingegangen</th><th>Typ</th><th>Name</th><th>Kontakt</th><th>Interesse</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function setLeadStatus(id,status){ await api('admin-content',{method:'POST',body:JSON.stringify({collection:'leads',action:'status',id,status})}); toast('Status gespeichert'); }
async function delLead(id){ if(!confirm('Lead löschen?'))return; await api('admin-content',{method:'POST',body:JSON.stringify({collection:'leads',action:'delete',id})}); await load(); }

function renderFit(){
  const f=DATA.funnel;
  document.getElementById('v-fit').innerHTML=`<h2>Fit-Check · Funnel</h2>
    <div class="panel"><div class="funnel">
      <div class="step"><div class="n">${f.start}</div><div class="t">gestartet</div></div>
      <div class="step"><div class="n">${f.complete}</div><div class="t">abgeschlossen (${f.completeRate}%)</div></div>
      <div class="step"><div class="n">${f.signup}</div><div class="t">danach angemeldet (${f.signupRate}%)</div></div>
      <div class="step"><div class="n">${f.dropoff}</div><div class="t">Abbrecher</div></div>
    </div>
    <p class="muted" style="margin-top:14px">„Abbrecher" = gestartet, aber nicht abgeschlossen. Tracking wird über die Fit-Check-Seite gesendet (siehe BACKEND-README).</p></div>`;
}

function renderWp(){
  const rows=(DATA.whitepapers||[]).map(w=>`
    <tr><td>${esc(w.title)}<div class="muted">${esc(w.description||'')}</div></td>
    <td><a href="${esc(w.fileUrl)}" target="_blank">${esc(w.fileUrl||'')}</a></td>
    <td>${w.active===false?'<span class="pill">inaktiv</span>':'<span class="pill neu">aktiv</span>'}</td>
    <td>${w.downloads||0}</td>
    <td><button class="btn btn--ghost btn--sm" onclick='editWp(${JSON.stringify(w)})'>✎</button>
        <button class="btn btn--ghost btn--sm" onclick="delWp('${w.id}')">×</button></td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">Noch keine Whitepapers.</td></tr>';
  document.getElementById('v-wp').innerHTML=`<h2>Whitepaper / PDFs</h2>
    <div class="panel"><table><thead><tr><th>Titel</th><th>Datei-URL</th><th>Status</th><th>Downloads</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="panel"><h3 id="wpFormTitle">Neues Whitepaper</h3>
      <input type="hidden" id="wp_id">
      <label>Titel</label><input id="wp_title">
      <label>Beschreibung</label><input id="wp_desc">
      <label>Datei-URL (z. B. /whitepaper.pdf oder externer Link)</label><input id="wp_url" placeholder="/whitepaper.pdf">
      <label><input type="checkbox" id="wp_active" checked style="width:auto;margin-right:6px">aktiv</label>
      <div style="margin-top:14px"><button class="btn" onclick="saveWp()">Speichern</button>
      <button class="btn btn--ghost" onclick="resetWp()">Zurücksetzen</button></div>
      <p class="muted" style="margin-top:10px">Download-Link für die Seite: <code>/.netlify/functions/download?id=&lt;ID&gt;</code></p></div>`;
}
function editWp(w){ wp_id.value=w.id; wp_title.value=w.title||''; wp_desc.value=w.description||''; wp_url.value=w.fileUrl||''; wp_active.checked=w.active!==false; document.getElementById('wpFormTitle').textContent='Whitepaper bearbeiten'; window.scrollTo(0,document.body.scrollHeight); }
function resetWp(){ wp_id.value='';wp_title.value='';wp_desc.value='';wp_url.value='';wp_active.checked=true; document.getElementById('wpFormTitle').textContent='Neues Whitepaper'; }
async function saveWp(){ if(!wp_title.value||!wp_url.value){toast('Titel und URL nötig');return;}
  const item={id:wp_id.value||undefined,title:wp_title.value,description:wp_desc.value,fileUrl:wp_url.value,active:wp_active.checked};
  await api('admin-content',{method:'POST',body:JSON.stringify({collection:'whitepapers',action:'save',item})}); toast('Gespeichert'); await load(); }
async function delWp(id){ if(!confirm('Whitepaper löschen?'))return; await api('admin-content',{method:'POST',body:JSON.stringify({collection:'whitepapers',action:'delete',id})}); await load(); }

function renderNews(){
  const rows=(DATA.news||[]).map(n=>`
    <tr><td>${esc(n.date||fmt(n.created))}</td><td>${esc(n.title)}<div class="muted">${esc((n.text||'').slice(0,90))}</div></td>
    <td>${n.link?'<a href="'+esc(n.link)+'" target="_blank">Link</a>':''}</td>
    <td><button class="btn btn--ghost btn--sm" onclick='editNews(${JSON.stringify(n)})'>✎</button>
        <button class="btn btn--ghost btn--sm" onclick="delNews('${n.id}')">×</button></td></tr>`).join('')
    || '<tr><td colspan="4" class="muted">Noch keine News.</td></tr>';
  document.getElementById('v-news').innerHTML=`<h2>News (KI-Bereich)</h2>
    <div class="panel"><table><thead><tr><th>Datum</th><th>Titel</th><th>Link</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="panel"><h3 id="newsFormTitle">Neue Meldung</h3>
      <input type="hidden" id="n_id">
      <div class="row"><div><label>Titel</label><input id="n_title"></div><div><label>Datum (Anzeige)</label><input id="n_date" placeholder="z. B. 15. Aug 2026"></div></div>
      <label>Text</label><textarea id="n_text" style="min-height:90px"></textarea>
      <label>Link (optional)</label><input id="n_link">
      <div style="margin-top:14px"><button class="btn" onclick="saveNews()">Speichern</button>
      <button class="btn btn--ghost" onclick="resetNews()">Zurücksetzen</button></div></div>`;
}
function editNews(n){ n_id.value=n.id;n_title.value=n.title||'';n_date.value=n.date||'';n_text.value=n.text||'';n_link.value=n.link||''; document.getElementById('newsFormTitle').textContent='Meldung bearbeiten'; window.scrollTo(0,document.body.scrollHeight); }
function resetNews(){ n_id.value='';n_title.value='';n_date.value='';n_text.value='';n_link.value=''; document.getElementById('newsFormTitle').textContent='Neue Meldung'; }
async function saveNews(){ if(!n_title.value){toast('Titel nötig');return;}
  const item={id:n_id.value||undefined,title:n_title.value,date:n_date.value,text:n_text.value,link:n_link.value};
  await api('admin-content',{method:'POST',body:JSON.stringify({collection:'news',action:'save',item})}); toast('Gespeichert'); await load(); }
async function delNews(id){ if(!confirm('Meldung löschen?'))return; await api('admin-content',{method:'POST',body:JSON.stringify({collection:'news',action:'delete',id})}); await load(); }

function renderNl(){
  const s=DATA.subscriberStats;
  document.getElementById('v-nl').innerHTML=`<h2>Newsletter-Center</h2>
    <div class="cards">
      <div class="stat"><div class="v"><em>${s.confirmed||0}</em></div><div class="l">bestätigte Empfänger</div></div>
      <div class="stat"><div class="v">${s.pending||0}</div><div class="l">unbestätigt</div></div>
      <div class="stat"><div class="v">${s.unsubscribed||0}</div><div class="l">abgemeldet</div></div>
    </div>
    <div class="panel">
      <label>Betreff</label><input id="nl_subject">
      <label>Inhalt (HTML erlaubt)</label><textarea id="nl_html"></textarea>
      <div class="row" style="margin-top:12px;align-items:end">
        <div><label>Test an (E-Mail)</label><input id="nl_test" placeholder="test@firma.de"></div>
        <div style="display:flex;gap:10px"><button class="btn btn--ghost" onclick="sendNl(true)">Test senden</button>
        <button class="btn" onclick="sendNl(false)">An alle bestätigten senden</button></div>
      </div>
      <p class="muted" style="margin-top:10px">Abmelde-Link wird automatisch angehängt. Versand erfordert gesetzte Mailjet-ENV-Variablen.</p>
    </div>`;
}
async function sendNl(test){
  const subject=nl_subject.value, html=nl_html.value;
  if(!subject||!html){toast('Betreff & Inhalt nötig');return;}
  if(test && !nl_test.value){toast('Test-E-Mail angeben');return;}
  if(!test && !confirm('Wirklich an ALLE bestätigten Empfänger senden?'))return;
  const r=await api('newsletter-send',{method:'POST',body:JSON.stringify({subject,html,test,testEmail:nl_test.value})});
  if(r.error){toast('Fehler: '+r.error);return;}
  toast(test?'Test gesendet':`Versand: ${r.sent}/${r.recipients} ok${r.failed?(', '+r.failed+' fehlgeschlagen'):''}`);
}

// Auto-Login wenn Token vorhanden
if(TOKEN){ enter(); }
</script>
</body>
</html>
