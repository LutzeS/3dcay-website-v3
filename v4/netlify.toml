# 3DCAY Website · V4 · Mono-Rot Edition
# Netlify-Site: 3dcay-version4
# Build-Setup wird im Dashboard verwaltet:
#   Base directory   = v4
#   Publish directory = v4
# Keine [build]-Sektion hier, sonst überschreibt sie die UI-Settings.

# 404 Fallback (Hash-URL für SPAs nicht relevant — pretty URLs aktiv)
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "interest-cohort=()"
