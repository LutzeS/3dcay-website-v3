<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — 3DCAY</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/jpeg" sizes="32x32" href="favicon.jpg">
<link rel="apple-touch-icon" href="favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0A;--red:#e3101a;--white:#FFF;--gray-100:#F0F0F0;--gray-200:#E5E5E5;--gray-500:#737373;--font-sans:'Inter',-apple-system,sans-serif;--font-mono:'JetBrains Mono',monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-sans);background:var(--black);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;overflow:hidden}

/* Background grid */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}

/* Red accent lines */
body::after{content:'';position:fixed;left:0;top:0;width:6px;height:100vh;background:var(--red)}

.logo{margin-bottom:48px}
.logo svg{height:28px;width:auto}

.code{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--red);margin-bottom:20px;display:block}

h1{font-size:clamp(48px,10vw,120px);font-weight:900;letter-spacing:-0.05em;line-height:1;margin-bottom:4px;background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,0.3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.subtitle{font-size:clamp(18px,2.5vw,26px);font-weight:700;letter-spacing:-0.02em;margin-bottom:16px;color:var(--white)}

.text{font-size:16px;color:rgba(255,255,255,0.5);max-width:440px;line-height:1.7;margin-bottom:48px}

.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:var(--white);font-size:15px;font-weight:600;padding:14px 28px;border-radius:100px;text-decoration:none;transition:background 0.2s;letter-spacing:-0.01em}
.btn-primary:hover{background:#ff1a25}

.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:transparent;color:rgba(255,255,255,0.7);font-size:15px;font-weight:500;padding:14px 28px;border-radius:100px;text-decoration:none;border:1px solid rgba(255,255,255,0.2);transition:all 0.2s}
.btn-secondary:hover{border-color:rgba(255,255,255,0.5);color:var(--white)}

.hint{margin-top:40px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:rgba(255,255,255,0.2);text-transform:uppercase}

        /* 3DCAY Logo — unified corporate logo */
        .nav__logo img, .nav-logo img, .as-nav__logo img, .wp-nav__logo img,
        .logo img, .wp-cover__logo img { height: 32px; width: auto; display: block; }
        .nav__logo img, .nav-logo img, .as-nav__logo img, .wp-nav__logo img { height: 28px; }
        footer .logo img { height: 32px; }
    </style>
</head>
<body>

<a href="/" class="logo" aria-label="3DCAY Home">
  <img src="images/3dcay-logo.svg" alt="3DCAY">
</a>

<span class="code">Error 404</span>
<h1>404</h1>
<p class="subtitle">Seite nicht gefunden.</p>
<p class="text">Die gesuchte Seite existiert nicht oder wurde verschoben. Kein Problem — finden Sie schnell zurück.</p>

<div class="actions">
  <a href="/" class="btn-primary">Zur Startseite &rarr;</a>
  <a href="/#kontakt" class="btn-secondary">Kontakt aufnehmen</a>
</div>

<p class="hint">3DCAY Marketing Solutions GmbH &mdash; www.3dcay.de</p>

</body>
</html>
